// Stable id from the ad URL. Never derived from row order, so statuses,
// notes and doc ticks survive re-scraping and re-sorting.
function posId(url) {
  let h = 0;
  for (let i = 0; i < url.length; i++) {
    h = ((h << 5) - h) + url.charCodeAt(i);
    h |= 0;
  }
  return "p" + Math.abs(h).toString(36);
}

function daysLeft(deadline) {

/* ---------------------------------------------------------------- scoring */
/* Success probability decomposed into three auditable factors:
     odds = base_odds(competition) x profile_fit x supervisor_receptivity
   Odds-space multiplication keeps the result in [0,1] and lets each factor
   be inspected separately in the breakdown popover.

   Important: the supervisor factor is NOT a published acceptance rate. No
   institution publishes per-supervisor admission statistics. It models
   receptivity from evidence you can actually gather, and stays neutral when
   you have not gathered any. */

const UNI_TIER_APPLICANTS = { elite: 110, strong: 55, mid: 28, regional: 14 };
const FIELD_HEAT = { very_high: 1.6, high: 1.3, moderate: 1.0, niche: 0.7 };

const ELITE = ["oxford", "cambridge", "mit", "eth zurich", "imperial", "epfl",
  "karolinska", "kaist", "nus", "tokyo"];
const STRONG = ["edinburgh", "glasgow", "manchester", "bristol", "ucl", "kcl",
  "king's", "delft", "munich", "kth", "aalto", "twente", "copenhagen",
  "amsterdam", "toronto", "melbourne", "dtu", "wageningen", "bath",
  "sheffield", "leeds", "reading"];

function inferUniTier(uni) {
  const u = (uni || "").toLowerCase();
  if (ELITE.some(k => u.includes(k))) return "elite";
  if (STRONG.some(k => u.includes(k))) return "strong";
  return "mid";
}

function inferFieldHeat(topic) {
  const t = (topic || "").toLowerCase();
  if (["llm", "agentic", "generative", "foundation model"].some(k => t.includes(k))) return "very_high";
  if (["deep learning", "computer vision", "reinforcement"].some(k => t.includes(k))) return "high";
  return "moderate";
}

function estimateApplicants(row, explicit) {
  if (explicit) return explicit;
  let base = UNI_TIER_APPLICANTS[inferUniTier(row.uni)] || 28;
  base *= FIELD_HEAT[inferFieldHeat(row.topic)] || 1;
  // Ads syndicated across several boards reach far more people. Sub-linear.
  base *= 1 + 0.18 * Math.max(0, (row.aggregatorCount || 1) - 1);
  // Most applications land in the first fortnight, so applying early helps.
  const age = row.daysPosted ?? 10;
  if (age <= 3) base *= 0.62;
  else if (age <= 7) base *= 0.78;
  else if (age <= 14) base *= 0.92;
  return Math.max(3, base);
}

function baseOdds(applicants) {
  // Not 1/N: roughly a third of any pool is unqualified, and several
  // candidates reach serious consideration.
  const effective = Math.max(2, applicants * 0.66);
  const p = Math.min(0.45, 3 / effective) * 0.55;
  return p / (1 - p);
}

function profileMultiplier(fit) {
  if (!fit.eligible || !fit.meetsHardReqs) return 0;
  let m = 0.35 + 3.4 * Math.pow(fit.topicSimilarity, 1.5);
  m *= 0.75 + 0.5 * fit.methodOverlap;
  if (fit.hasPublications) m *= 1.45;
  if (!fit.degreeMatch) m *= 0.6;
  return Math.max(0.05, Math.min(5, m));
}

const REPLY_MULT = { positive: 2.6, neutral: 1.35, none_yet: 1.0, no_reply: 0.72, discouraging: 0.25 };
const REPLY_LABEL = {
  none_yet: "Not contacted", positive: "Replied, encouraging",
  neutral: "Replied, neutral", no_reply: "No reply", discouraging: "Discouraging reply",
};
const INTAKE_MULT = { recent: 1.3, unknown: 1.0, none_recent: 0.65 };

function supervisorMultiplier(sup) {
  let m = REPLY_MULT[sup.reply] ?? 1;
  if (sup.reply === "no_reply" && (sup.daysSinceContact ?? 0) < 10) m = 1;
  m *= INTAKE_MULT[sup.intake] ?? 1;
  return Math.max(0.1, Math.min(4, m));
}

function supervisorEvidence(sup) {
  let n = 0;
  if (sup.reply && sup.reply !== "none_yet") n++;
  if (sup.intake && sup.intake !== "unknown") n++;
  return n;
}

function scorePosition(row, sup) {
  // Topic similarity is seeded from the scraper's own match score until the
  // embedding pipeline replaces it.
  const fit = {
    topicSimilarity: Math.min(1, (row.chance || 50) / 100),
    methodOverlap: Math.min(1, (row.chance || 50) / 110),
    hasPublications: false,
    degreeMatch: true,
    meetsHardReqs: true,
    eligible: true,
  };
  const applicants = estimateApplicants(row);
  const pm = profileMultiplier(fit);
  const sm = supervisorMultiplier(sup);

  if (pm === 0) {
    return { pct: 0, low: 0, high: 0, applicants: Math.round(applicants), confidence: "high", blocked: true, pm, sm };
  }

  const odds = baseOdds(applicants) * pm * sm;
  const p = odds / (1 + odds);

  const ev = supervisorEvidence(sup);
  const [confidence, spread] = ev >= 2 ? ["high", 0.28] : ev >= 1 ? ["medium", 0.45] : ["low", 0.65];

  return {
    pct: +(p * 100).toFixed(1),
    low: +(p * 100 * (1 - spread)).toFixed(1),
    high: +Math.min(95, p * 100 * (1 + spread)).toFixed(1),
    applicants: Math.round(applicants),
    confidence,
    blocked: false,
    pm: +pm.toFixed(2),
    sm: +sm.toFixed(2),
  };
}

function scoreBadge(s) {
  let bg, fg;
  if (s.pct >= 25) { bg = "#EAF3DE"; fg = "#27500A"; }
  else if (s.pct >= 10) { bg = "#EDEFF2"; fg = "#3E4C59"; }
  else if (s.pct >= 4) { bg = "#F4E9E9"; fg = "#791F1F"; }
  else { bg = "#F1EFE8"; fg = "#57544C"; }
  return { bg, fg };
}

function chanceBadge(val) {
  let bg, fg;
  if (val >= 75) { bg = "#EAF3DE"; fg = "#27500A"; }
  else if (val >= 50) { bg = "#EDEFF2"; fg = "#3E4C59"; }
  else if (val >= 25) { bg = "#F4E9E9"; fg = "#791F1F"; }
  else { bg = "#F1EFE8"; fg = "#57544C"; }
  return (
    <span style={{ background: bg, color: fg, padding: "2px 7px", borderRadius: 6, fontWeight: 500, fontSize: 11, whiteSpace: "nowrap" }}>
      {val}%
    </span>
  );
}

  const [deleted, setDeleted] = useState({});
  const [notesMap, setNotesMap] = useState({});
  const [emailMap, setEmailMap] = useState({});
  const [docsMap, setDocsMap] = useState({});

  const [filters, setFilters] = useState({});
  const [filterSearch, setFilterSearch] = useState({});
  const [colSearch, setColSearch] = useState({});
  const [openFilter, setOpenFilter] = useState(null);
  const [sortCol, setSortCol] = useState("deadline");
  const [sortDir, setSortDir] = useState("asc");
  const [visibleCount, setVisibleCount] = useState(BATCH);

  const [selectMode, setSelectMode] = useState(false);
  const [selected, setSelected] = useState(new Set());
  const [view, setView] = useState("active");
  const [newIds, setNewIds] = useState(new Set());
  const [refreshing, setRefreshing] = useState(false);
  const [lastSync, setLastSync] = useState(null);

  const [sources, setSources] = useState(DEFAULT_SOURCES);
  const [showSources, setShowSources] = useState(false);
  const [editingSource, setEditingSource] = useState(null);

  const [loaded, setLoaded] = useState(false);
  const [showFeedback, setShowFeedback] = useState(false);
  const [showIntro, setShowIntro] = useState(true);
  const [supMap, setSupMap] = useState({});
  const [openScore, setOpenScore] = useState(null);

  const sentinelRef = useRef(null);

  /* ------------------------------------------------------------ persistence */
  useEffect(() => {
    (async () => {
      const keys = [
        ["phd_status", setStatusMap], ["phd_issue", setIssueMap],
        ["phd_archived", setArchived], ["phd_deleted", setDeleted],
        ["phd_notes", setNotesMap], ["phd_emails", setEmailMap],
        ["phd_docs", setDocsMap], ["phd_sources", setSources],
        ["phd_supervisor", setSupMap],
      ];
      for (const [k, setter] of keys) {
        try {
          // shared:false -> every visitor gets their own private board
          const r = await window.storage?.get(k, false);
          if (r?.value) setter(JSON.parse(r.value));
        } catch (e) { /* nothing saved yet */ }
      }
      setLoaded(true);
    })();
  }, []);

  const persist = (key, value) => {
    window.storage?.set(key, JSON.stringify(value), false).catch(() => {});
  };

  const updateMap = useCallback((setter, key, id, value) => {
    setter(prev => {
      const next = { ...prev };
      if (value === null || value === false || value === "") delete next[id];
      else next[id] = value;
      persist(key, next);
      return next;
    });
  }, []);

  const bulkFlag = useCallback((setter, key, ids, value) => {
    setter(prev => {
      const next = { ...prev };
      ids.forEach(id => { if (value) next[id] = true; else delete next[id]; });
      persist(key, next);
      return next;
    });
  }, []);

  const setStatus = useCallback((id, v) => updateMap(setStatusMap, "phd_status", id, v), [updateMap]);
  const toggleIssue = useCallback((id) => {
    setIssueMap(prev => {
      const next = { ...prev };
      if (next[id]) delete next[id]; else next[id] = true;
      persist("phd_issue", next);
      return next;
    });
  }, []);
  const toggleArchive = useCallback((id) => {
    setArchived(prev => {
      const next = { ...prev };
      if (next[id]) delete next[id]; else next[id] = true;
      persist("phd_archived", next);
      return next;
    });
  }, []);
  const setNote = useCallback((id, v) => updateMap(setNotesMap, "phd_notes", id, v), [updateMap]);  const setSupervisor = useCallback((id, patch) => {
    setSupMap(prev => {
      const next = { ...prev, [id]: { ...(prev[id] || {}), ...patch } };
      persist("phd_supervisor", next);
      return next;
    });
  }, []);

  const setEmail = useCallback((id, v) => updateMap(setEmailMap, "phd_emails", id, v), [updateMap]);

  const toggleDoc = useCallback((id, doc) => {
    setDocsMap(prev => {
      const forRow = { ...(prev[id] || {}) };
      if (forRow[doc]) delete forRow[doc]; else forRow[doc] = true;
      const next = { ...prev, [id]: forRow };
      if (Object.keys(forRow).length === 0) delete next[id];
      persist("phd_docs", next);
      return next;
    });
  }, []);

  /* ------------------------------------------------------------ bulk actions */
  const archiveSelected = useCallback(() => {
    if (!selected.size) return;
    bulkFlag(setArchived, "phd_archived", Array.from(selected), true);
    setSelected(new Set());
  }, [selected, bulkFlag]);

  const deleteSelected = useCallback(() => {
    if (!selected.size) return;
    bulkFlag(setDeleted, "phd_deleted", Array.from(selected), true);
    setSelected(new Set());
  }, [selected, bulkFlag]);

  const restoreSelected = useCallback(() => {
    if (!selected.size) return;
    const ids = Array.from(selected);
    bulkFlag(setArchived, "phd_archived", ids, false);
    bulkFlag(setDeleted, "phd_deleted", ids, false);
    setSelected(new Set());
  }, [selected, bulkFlag]);

  const toggleSelect = useCallback((id) => {
    setSelected(prev => {
      const n = new Set(prev);
      if (n.has(id)) n.delete(id); else n.add(id);
      return n;
    });
  }, []);

  /* ------------------------------------------------------------ refresh/export */
  const handleRefresh = useCallback(() => {
    setRefreshing(true);
    setTimeout(() => {
      setRows(prev => {
        const byId = new Map(prev.map(r => [r.id, r]));
        const added = new Set();
        INCOMING.map(decorate).forEach(inc => {
          const ex = byId.get(inc.id);
          if (ex) byId.set(inc.id, { ...ex, ...inc });
          else { byId.set(inc.id, inc); added.add(inc.id); }
        });
        setNewIds(added);
        return Array.from(byId.values());
      });
      setLastSync(new Date());
      setRefreshing(false);
    }, 600);
  }, []);

  const processedRef = useRef([]);
  const handleExport = useCallback(() => {
    const data = processedRef.current.map((r, i) => {
      const docs = docList(r.requires);
      const done = docs.filter(d => docsMap[r.id]?.[d]).length;
      return {
        "Ser": i + 1,
        "PhD topic": r.topic,
        "Ad URL": r.url,
        "Source": r.source,
        "Deadline": fmtDate(r.deadline),
        "Uni": r.uni,
        "Country": r.country,
        "% Chance": r.chance,
        "Days left": r.daysLeft,
        "Calendar entry": r.calendarEntry,
        "Requires": r.requires,
        "Docs ready": `${done}/${docs.length}`,
        "Prof email": r.profEmail,
        "Remarks": r.remarks,
        "My notes": r.notes,
        "Status": r.status,
        "Issue flagged": issueMap[r.id] ? "Yes" : "No",
        "Archived": archived[r.id] ? "Yes" : "No",
      };
    });
    const ws = XLSX.utils.json_to_sheet(data);
    ws["!cols"] = [{ wch: 5 }, { wch: 50 }, { wch: 44 }, { wch: 15 }, { wch: 13 }, { wch: 20 },
      { wch: 13 }, { wch: 9 }, { wch: 9 }, { wch: 14 }, { wch: 26 }, { wch: 11 }, { wch: 30 },
      { wch: 30 }, { wch: 34 }, { wch: 13 }, { wch: 13 }, { wch: 10 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "PhD positions");
    XLSX.writeFile(wb, `phd_positions_${new Date().toISOString().slice(0, 10)}.xlsx`);
  }, [docsMap, issueMap, archived]);

  /* ------------------------------------------------------------ source CRUD */
  const saveSource = (src) => {
    setSources(prev => {
      const exists = prev.some(s => s.id === src.id);
      const next = exists ? prev.map(s => (s.id === src.id ? src : s)) : [...prev, src];
      persist("phd_sources", next);
      return next;
    });
    setEditingSource(null);
  };
  const deleteSource = (id) => {
    setSources(prev => {
      const next = prev.filter(s => s.id !== id);
      persist("phd_sources", next);
      return next;
    });
  };
  const toggleSourceEnabled = (id) => {
    setSources(prev => {
      const next = prev.map(s => (s.id === id ? { ...s, enabled: !s.enabled } : s));
      persist("phd_sources", next);
      return next;
    });
  };

  /* ------------------------------------------------------------ derivation */
  const enrichedRows = useMemo(() => rows.map(r => ({
    ...r,
    status: STATUS_LABEL[statusMap[r.id] || "none"],
    profEmail: emailMap[r.id] ?? r.profEmail ?? "",
    notes: notesMap[r.id] || "",
    isArchived: !!archived[r.id],
    isDeleted: !!deleted[r.id],
    hasIssue: !!issueMap[r.id],
  })), [rows, statusMap, emailMap, notesMap, archived, deleted, issueMap]);

  const viewFiltered = useMemo(() => {
    if (view === "active") return enrichedRows.filter(r => !r.isArchived && !r.isDeleted);
    if (view === "archived") return enrichedRows.filter(r => r.isArchived && !r.isDeleted);
    if (view === "deleted") return enrichedRows.filter(r => r.isDeleted);
    return enrichedRows;
  }, [enrichedRows, view]);

  const viewRef = useRef(viewFiltered);
  viewRef.current = viewFiltered;

  const summary = useMemo(() => {
    const active = enrichedRows.filter(r => !r.isArchived && !r.isDeleted);
    let applied = 0, rejected = 0, offer = 0, issues = 0;
    active.forEach(r => {
      const s = statusMap[r.id] || "none";
      if (s === "applied") applied++;
      else if (s === "rejected") rejected++;
      else if (s === "offer") offer++;
      if (r.hasIssue) issues++;
    });
    const total = active.length;
    const notApplied = total - (applied + rejected + offer);
    const decided = rejected + offer;
    return {
      total, notApplied, awaiting: applied, rejected, offer, issues, decided,
      successRate: decided > 0 ? Math.round((offer / decided) * 100) : 0,
      archivedCount: enrichedRows.filter(r => r.isArchived && !r.isDeleted).length,
      deletedCount: enrichedRows.filter(r => r.isDeleted).length,
    };
  }, [enrichedRows, statusMap]);

  const processed = useMemo(() => {
    let data = [...viewFiltered];
    Object.entries(filters).forEach(([k, set]) => {
      data = data.filter(r => set.has(cellText(r, k)));
    });
    Object.entries(colSearch).forEach(([k, term]) => {
      const q = term.trim().toLowerCase();
      if (!q) return;
      data = data.filter(r => cellText(r, k).toLowerCase().includes(q));
    });
    const col = COLS.find(c => c.key === sortCol);
    data.sort((a, b) => {
      let va = a[sortCol], vb = b[sortCol];
      if (col?.type === "num") return sortDir === "asc" ? va - vb : vb - va;
      if (col?.type === "date") return sortDir === "asc" ? new Date(va) - new Date(vb) : new Date(vb) - new Date(va);
      va = String(va).toLowerCase(); vb = String(vb).toLowerCase();
      return sortDir === "asc" ? va.localeCompare(vb) : vb.localeCompare(va);
    });
    return data;
  }, [viewFiltered, filters, colSearch, sortCol, sortDir]);

  processedRef.current = processed;
  const visible = processed.slice(0, visibleCount);

  useEffect(() => {
    const el = sentinelRef.current;
    if (!el) return;
    const obs = new IntersectionObserver(e => {
      if (e[0].isIntersecting && visibleCount < processed.length) {
        setVisibleCount(p => Math.min(p + BATCH, processed.length));
      }
    }, { threshold: 0.1 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [visibleCount, processed.length]);

  /* ------------------------------------------------------------ filter ops */
  const toggleValueInFilter = (key, value) => {
    setFilters(prev => {
      const all = new Set(viewRef.current.map(r => cellText(r, key)));
      const base = prev[key] ? new Set(prev[key]) : new Set(all);
      if (base.has(value)) base.delete(value); else base.add(value);
      const next = { ...prev };
      if (base.size === all.size) delete next[key];
      else next[key] = base;
      return next;
    });
  };
  const clearColumnFilter = (key) => setFilters(p => { const n = { ...p }; delete n[key]; return n; });
  const toggleSort = (key) => {
    if (sortCol === key) setSortDir(d => (d === "asc" ? "desc" : "asc"));
    else { setSortCol(key); setSortDir("asc"); }
  };

  const activeSearches = Object.values(colSearch).filter(v => v && v.trim()).length;
  const activeFilters = Object.keys(filters).length + activeSearches;

  /* ------------------------------------------------------------ styles */
  const btn = {
    background: "var(--surface-1)", color: "var(--text-primary)",
    border: "0.5px solid var(--border-strong)", borderRadius: "var(--radius)",
    padding: "5px 10px", fontSize: 12, cursor: "pointer", whiteSpace: "nowrap",
  };
  const thStyle = {
    padding: 0, textAlign: "left", fontWeight: 500, color: "var(--text-secondary)",
    fontSize: 11, letterSpacing: "0.3px", position: "sticky", top: 0,
    background: "var(--surface-1)", zIndex: 2, verticalAlign: "top",
    borderBottom: "1px solid var(--border-strong)",
  };
  const tdBase = {
    padding: "7px 6px", fontSize: 12, verticalAlign: "top",
    borderBottom: "0.5px solid var(--border)",
  };

  const SUMMARY_CARDS = [
    { label: "Total", value: summary.total, bg: "#F1EFE8", fg: "#3D3A34", filterVal: null },
    { label: "Not applied (pending)", value: summary.notApplied, bg: "#EDEBE3", fg: "#57544C", filterVal: "Not applied" },
    { label: "Applied (awaiting)", value: summary.awaiting, bg: "#E6F1FB", fg: "#0C447C", filterVal: "Applied" },
    { label: "Rejected", value: summary.rejected, bg: "#E7E4DC", fg: "#57544C", filterVal: "Rejected" },
    { label: "Offers", value: summary.offer, bg: "#EAF3DE", fg: "#27500A", filterVal: "Offer" },
    { label: "Success rate", value: `${summary.successRate}%`, bg: "#DCEBCB", fg: "#1F3D08", sub: `${summary.offer}/${summary.decided} decided`, filterVal: undefined },
  ];

  return (
    <div style={{ fontFamily: "var(--font-sans)", padding: "0.5rem 0" }}>

      {/* ---------------------------------------------------------- toolbar */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12, gap: 12, flexWrap: "wrap" }}>
        {/* left: what am I looking at, and what am I acting on */}
        <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
          <button
            onClick={() => { setSelectMode(m => !m); setSelected(new Set()); }}
            style={{ ...btn, background: selectMode ? "var(--bg-accent)" : "var(--surface-1)", color: selectMode ? "var(--text-accent)" : "var(--text-primary)" }}
          >
            {selectMode ? `Selecting (${selected.size})` : "Select"}
          </button>
          <div style={{ display: "inline-flex", border: "0.5px solid var(--border-strong)", borderRadius: "var(--radius)", overflow: "hidden" }}>
            {[
              { val: "active", label: "Active" },
              { val: "archived", label: `Archived${summary.archivedCount ? ` (${summary.archivedCount})` : ""}` },
              { val: "deleted", label: `Trash${summary.deletedCount ? ` (${summary.deletedCount})` : ""}` },
            ].map((v, i) => (
              <button key={v.val}
                onClick={() => { setView(v.val); setSelected(new Set()); }}
                style={{
                  background: view === v.val ? "var(--bg-accent)" : "var(--surface-1)",
                  color: view === v.val ? "var(--text-accent)" : "var(--text-secondary)",
                  border: "none", borderLeft: i === 0 ? "none" : "0.5px solid var(--border)",
                  padding: "5px 10px", fontSize: 12, cursor: "pointer", fontWeight: view === v.val ? 500 : 400,
                }}>
                {v.label}
              </button>
            ))}
          </div>
          {selectMode && view !== "archived" && view !== "deleted" && (
            <button onClick={archiveSelected} disabled={!selected.size}
              style={{ ...btn, background: "#EDEBE3", color: "#57544C", border: "none", opacity: selected.size ? 1 : 0.5, cursor: selected.size ? "pointer" : "default" }}>
              Archive
            </button>
          )}
          {selectMode && view !== "deleted" && (
            <button onClick={deleteSelected} disabled={!selected.size}
              style={{ ...btn, background: "#F4E9E9", color: "#791F1F", border: "none", opacity: selected.size ? 1 : 0.5, cursor: selected.size ? "pointer" : "default" }}>
              Delete
            </button>
          )}
          {selectMode && (view === "archived" || view === "deleted") && (
            <button onClick={restoreSelected} disabled={!selected.size}
              style={{ ...btn, background: "#EAF3DE", color: "#27500A", border: "none", opacity: selected.size ? 1 : 0.5, cursor: selected.size ? "pointer" : "default" }}>
              Restore
            </button>
          )}
        </div>

        {/* right: data in, data out, configuration */}
        <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
          {activeFilters > 0 && (
            <button onClick={() => { setFilters({}); setColSearch({}); setOpenFilter(null); }}
              style={{ ...btn, background: "#F4E9E9", color: "#791F1F", border: "none" }}>
              Clear filters
            </button>
          )}
          <button onClick={handleRefresh} disabled={refreshing}
            style={{ ...btn, opacity: refreshing ? 0.6 : 1, cursor: refreshing ? "default" : "pointer" }}>
            {refreshing ? "Fetching…" : "Refresh"}
          </button>
          <button onClick={handleExport} style={btn}>Export Excel</button>
          <button onClick={() => setShowSources(s => !s)}
            style={{ ...btn, background: showSources ? "var(--bg-accent)" : "var(--surface-1)", color: showSources ? "var(--text-accent)" : "var(--text-primary)" }}>
            Manage sources
          </button>
          <button onClick={() => setShowFeedback(s => !s)}
            style={{ ...btn, background: showFeedback ? "var(--bg-accent)" : "#EAF3DE", color: showFeedback ? "var(--text-accent)" : "#27500A", border: showFeedback ? "0.5px solid var(--border-strong)" : "none" }}>
            Feedback
          </button>
        </div>
      </div>

      <div style={{ marginBottom: 12 }}>
        <h2 style={{ fontSize: 18, fontWeight: 500, margin: "0 0 2px", color: "var(--text-primary)" }}>PhD positions</h2>
        <p style={{ fontSize: 12, color: "var(--text-secondary)", margin: 0 }}>
          {loaded ? `${processed.length} of ${viewFiltered.length} shown` : "restoring your board…"}
          {activeFilters > 0 && ` · ${activeFilters} filter${activeFilters > 1 ? "s" : ""}`}
          {summary.issues > 0 && ` · ${summary.issues} flagged with issues`}
          {lastSync && ` · synced ${lastSync.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`}
          {newIds.size > 0 && ` · ${newIds.size} new`}
        </p>
      </div>

      {/* ------------------------------------------------------ public intro */}
      {showIntro && (
        <div style={{
          border: "0.5px solid var(--border-strong)", borderLeft: "3px solid #639922",
          borderRadius: 8, padding: "10px 12px", marginBottom: 12, background: "var(--surface-1)",
          display: "flex", justifyContent: "space-between", gap: 12, alignItems: "flex-start",
        }}>
          <p style={{ fontSize: 12, color: "var(--text-secondary)", margin: 0, lineHeight: 1.5 }}>
            Open preview. Track funded PhD positions: set a status, tick off documents as you
            prepare them, flag issues, and keep private notes. Everything you change is saved to
            your own board and is not visible to anyone else. The positions below are sample data
            so you can try the workflow. Tell me what is missing via the Feedback button.
          </p>
          <button onClick={() => setShowIntro(false)}
            style={{ background: "transparent", border: "none", color: "var(--text-muted)", cursor: "pointer", fontSize: 16, lineHeight: 1, padding: 0 }}>
            &times;
          </button>
        </div>
      )}

      {/* --------------------------------------------------------- feedback */}
      {showFeedback && <FeedbackPanel onClose={() => setShowFeedback(false)} />}

      {/* ------------------------------------------------------ source admin */}
      {showSources && (
        <SourceManager
          sources={sources}
          editing={editingSource}
          setEditing={setEditingSource}
          onSave={saveSource}
          onDelete={deleteSource}
          onToggle={toggleSourceEnabled}
        />
      )}

      {/* ---------------------------------------------------------- summary */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(104px, 1fr))", gap: 8, marginBottom: 14 }}>
        {SUMMARY_CARDS.map(card => {
          const clickable = card.filterVal !== undefined;
          const isSel = clickable && (card.filterVal === null
            ? !filters.status
            : filters.status && filters.status.size === 1 && filters.status.has(card.filterVal));
          return (
            <div key={card.label}
              onClick={clickable ? () => setFilters(prev => {
                const n = { ...prev };
                if (card.filterVal === null || isSel) delete n.status;
                else n.status = new Set([card.filterVal]);
                return n;
              }) : undefined}
              style={{
                background: card.bg, borderRadius: "var(--radius)", padding: "10px 12px",
                cursor: clickable ? "pointer" : "default",
                outline: isSel ? "2px solid var(--border-accent)" : "none",
                outlineOffset: -2,
              }}>
              <p style={{ fontSize: 11, color: card.fg, opacity: 0.85, margin: "0 0 4px", fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{card.label}</p>
              <p style={{ fontSize: 20, fontWeight: 600, color: card.fg, margin: 0 }}>{card.value}</p>
              {card.sub && <p style={{ fontSize: 10, color: card.fg, opacity: 0.7, margin: "2px 0 0" }}>{card.sub}</p>}
            </div>
          );
        })}
      </div>

      {/* ------------------------------------------------------------ table */}
      <div style={{ overflowX: "auto", border: "1px solid var(--border-strong)", borderRadius: 10, background: "var(--surface-2)" }}>
        <table style={{ width: "100%", minWidth: TABLE_MIN, borderCollapse: "collapse" }}>
          <thead>
            <tr>
              {COLS.map(col => {
                const isActive = sortCol === col.key;
                const hasFilter = !!filters[col.key];
                const isOpen = openFilter === col.key;
                return (
                  <th key={col.key} style={{ ...thStyle, width: col.w }}>
                    <div style={{ padding: "7px 6px 5px" }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: col.align === "center" ? "center" : "flex-start", gap: 3, minHeight: 18 }}>
                        <span style={{ textTransform: "uppercase", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{col.label}</span>
                        {col.sort && (
                          <button onClick={() => toggleSort(col.key)} title={`Sort by ${col.label}`}
                            style={{
                              background: isActive ? "var(--bg-accent)" : "transparent", border: "none",
                              borderRadius: 4, cursor: "pointer", padding: "1px 3px", display: "inline-flex",
                              color: isActive ? "var(--text-accent)" : "var(--text-muted)", fontSize: 12,
                            }}>
                            {isActive && sortDir === "desc" ? "\u2193" : "\u2191"}
                          </button>
                        )}
                        {col.filter && (
                          <button onClick={() => setOpenFilter(isOpen ? null : col.key)} title={`Filter ${col.label}`}
                            style={{
                              background: hasFilter ? "var(--bg-accent)" : "transparent", border: "none",
                              borderRadius: 4, cursor: "pointer", padding: "1px 3px", display: "inline-flex",
                              color: hasFilter ? "var(--text-accent)" : "var(--text-muted)", fontSize: 9,
                            }}>
                            &#x25BC;
                          </button>
                        )}
                      </div>

                      {col.search ? (
                        <div style={{ paddingTop: 4 }}>
                          <input type="text" placeholder="search…"
                            value={colSearch[col.key] || ""}
                            onChange={e => setColSearch(p => ({ ...p, [col.key]: e.target.value }))}
                            style={{
                              width: "100%", boxSizing: "border-box", padding: "3px 6px", fontSize: 11,
                              fontWeight: 400, textTransform: "none", border: "0.5px solid var(--border)",
                              borderRadius: 4, background: "var(--surface-2)", color: "var(--text-primary)",
                              outline: "none", height: 22,
                            }} />
                        </div>
                      ) : <div style={{ height: 26 }} />}

                      {isOpen && col.filter && (() => {
                        const all = Array.from(new Set(viewFiltered.map(r => cellText(r, col.key)))).sort();
                        const sel = filters[col.key] || new Set(all);
                        const q = (filterSearch[col.key] || "").toLowerCase();
                        const shown = q ? all.filter(v => v.toLowerCase().includes(q)) : all;
                        return (
                          <div style={{
                            position: "absolute", zIndex: 20, marginTop: 2, background: "var(--surface-2)",
                            border: "0.5px solid var(--border-strong)", borderRadius: 8,
                            boxShadow: "var(--shadow-popover)", padding: 8, width: 210,
                            textTransform: "none", fontWeight: 400,
                          }}>
                            <input autoFocus type="text" placeholder="Search values"
                              value={filterSearch[col.key] || ""}
                              onChange={e => setFilterSearch(p => ({ ...p, [col.key]: e.target.value }))}
                              onKeyDown={e => { if (e.key === "Escape") setOpenFilter(null); }}
                              style={{
                                width: "100%", boxSizing: "border-box", padding: "5px 7px", fontSize: 12,
                                border: "0.5px solid var(--border-strong)", borderRadius: 4,
                                background: "var(--surface-2)", color: "var(--text-primary)",
                                outline: "none", height: 26, marginBottom: 6,
                              }} />
                            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                              <button onClick={() => clearColumnFilter(col.key)}
                                style={{ fontSize: 11, color: "var(--text-accent)", background: "transparent", border: "none", cursor: "pointer", padding: 0 }}>
                                Select all
                              </button>
                              <button onClick={() => setOpenFilter(null)}
                                style={{ fontSize: 11, color: "var(--text-secondary)", background: "transparent", border: "none", cursor: "pointer", padding: 0 }}>
                                Done
                              </button>
                            </div>
                            <div style={{ maxHeight: 180, overflowY: "auto", display: "flex", flexDirection: "column", gap: 2 }}>
                              {shown.map(v => (
                                <label key={v} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, cursor: "pointer", color: "var(--text-primary)" }}>
                                  <input type="checkbox" checked={sel.has(v)} onChange={() => toggleValueInFilter(col.key, v)} style={{ margin: 0 }} />
                                  <span style={{ flex: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }} title={v}>{v}</span>
                                </label>
                              ))}
                              {shown.length === 0 && <span style={{ fontSize: 11, color: "var(--text-muted)" }}>No matching values</span>}
                            </div>
                          </div>
                        );
                      })()}
                    </div>
                  </th>
                );
              })}
            </tr>
          </thead>

          <tbody>
            {visible.map((row, i) => {
              const sVal = statusMap[row.id] || "none";
              const vis = rowVisual(sVal, row.hasIssue, row.daysLeft);
              const td = {
                ...tdBase,
                background: vis.bg,
                color: vis.fg,
                fontWeight: vis.bold ? 600 : 400,
              };
              const docs = docList(row.requires);
              const doneCount = docs.filter(d => docsMap[row.id]?.[d]).length;
              return (
                <tr key={row.id}>
                  <td style={{ ...td, textAlign: "center", fontSize: 11, opacity: 0.7 }}>{i + 1}</td>

                  <td style={td}>
                    {selectMode && (
                      <input type="checkbox" checked={selected.has(row.id)} onChange={() => toggleSelect(row.id)}
                        style={{ margin: "0 6px 0 0", verticalAlign: "middle", cursor: "pointer" }} />
                    )}
                    {newIds.has(row.id) && (
                      <span style={{ background: "#DCEBCB", color: "#27500A", fontSize: 9, fontWeight: 600, padding: "1px 5px", borderRadius: 4, marginRight: 5 }}>NEW</span>
                    )}
                    <a href={row.url} target="_blank" rel="noopener noreferrer"
                      style={{ color: vis.muted ? "#8C8880" : "#185FA5", textDecoration: "none", fontWeight: vis.bold ? 600 : 500, lineHeight: 1.4 }}>
                      {row.topic}
                      <span style={{ fontSize: 10, marginLeft: 3, opacity: 0.6 }}>&#x2197;</span>
                    </a>
                  </td>

                  <td style={{ ...td, fontSize: 11 }}>{row.source}</td>
                  <td style={{ ...td, whiteSpace: "nowrap" }}>{fmtDate(row.deadline)}</td>
                  <td style={td}>{row.uni}</td>
                  <td style={td}>{row.country}</td>
                  <td style={{ ...td, textAlign: "center", position: "relative" }}>
                    {(() => {
                      const sup = supMap[row.id] || { reply: "none_yet", intake: "unknown" };
                      const sc = scorePosition(row, sup);
                      const c = scoreBadge(sc);
                      const open = openScore === row.id;
                      return (
                        <>
                          <button
                            onClick={() => setOpenScore(open ? null : row.id)}
                            title="How this was calculated"
                            style={{
                              background: c.bg, color: c.fg, padding: "2px 7px", borderRadius: 6,
                              fontWeight: 600, fontSize: 11, whiteSpace: "nowrap",
                              border: "none", cursor: "pointer", lineHeight: 1.3,
                            }}>
                            {sc.pct}%
                          </button>
                          <div style={{ fontSize: 9, color: "inherit", opacity: 0.65, marginTop: 2 }}>
                            {sc.low}-{sc.high}
                          </div>
                          <div style={{ fontSize: 8.5, opacity: 0.55, textTransform: "uppercase", letterSpacing: 0.2 }}>
                            {sc.confidence} conf
                          </div>
                          {open && (
                            <div style={{
                              position: "absolute", zIndex: 30, right: 0, top: "100%",
                              width: 230, textAlign: "left", background: "var(--surface-2)",
                              border: "0.5px solid var(--border-strong)", borderRadius: 8,
                              boxShadow: "var(--shadow-popover)", padding: 10, fontWeight: 400,
                              color: "var(--text-primary)",
                            }}>
                              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                                <span style={{ fontSize: 11, fontWeight: 600 }}>How this is calculated</span>
                                <button onClick={() => setOpenScore(null)}
                                  style={{ background: "transparent", border: "none", cursor: "pointer", color: "var(--text-muted)", fontSize: 13, lineHeight: 1, padding: 0 }}>&times;</button>
                              </div>
                              {[
                                ["Estimated applicants", `~${sc.applicants}`],
                                ["Your profile fit", `${sc.pm}x`],
                                ["Supervisor signal", `${sc.sm}x`],
                                ["Confidence", sc.confidence],
                              ].map(([k, v]) => (
                                <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 10.5, padding: "2px 0", borderBottom: "0.5px solid var(--border)" }}>
                                  <span style={{ color: "var(--text-secondary)" }}>{k}</span>
                                  <span style={{ fontWeight: 500 }}>{v}</span>
                                </div>
                              ))}
                              <p style={{ fontSize: 9.5, color: "var(--text-secondary)", margin: "7px 0 0", lineHeight: 1.4 }}>
                                Applicant count is estimated from university tier, how widely the
                                ad was syndicated, and how long it has been live. The supervisor
                                factor reflects what you have recorded about their responsiveness,
                                not a published acceptance rate. Nobody publishes those. Record a
                                reply below the email to narrow the band.
                              </p>
                            </div>
                          )}
                        </>
                      );
                    })()}
                  </td>
                  <td style={{ ...td, textAlign: "center", fontWeight: row.daysLeft <= 7 ? 700 : 500 }}>{row.daysLeft}</td>
                  <td style={{ ...td, textAlign: "center", fontSize: 11 }}>{row.calendarEntry}</td>

                  {/* required documents as a tick list */}
                  <td style={{ ...td, fontSize: 11 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3, opacity: 0.75 }}>
                      <span style={{ fontSize: 10 }}>docs</span>
                      <span style={{ fontSize: 10, fontWeight: 600, color: doneCount === docs.length ? "#27500A" : "inherit" }}>
                        {doneCount}/{docs.length}
                      </span>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 1 }}>
                      {docs.map(d => {
                        const on = !!docsMap[row.id]?.[d];
                        return (
                          <label key={d} style={{ display: "flex", alignItems: "center", gap: 4, cursor: "pointer", fontSize: 10.5, lineHeight: 1.35 }}>
                            <input type="checkbox" checked={on} onChange={() => toggleDoc(row.id, d)}
                              style={{ margin: 0, width: 11, height: 11, cursor: "pointer", flexShrink: 0 }} />
                            <span style={{ textDecoration: on ? "line-through" : "none", opacity: on ? 0.6 : 1 }}>{d}</span>
                          </label>
                        );
                      })}
                    </div>
                  </td>

                  {/* editable prof email, supports several addresses */}
                  <td style={{ ...td, fontSize: 11 }}>
                    <input
                      type="text"
                      value={row.profEmail}
                      placeholder="add email(s), comma separated"
                      onChange={e => setEmail(row.id, e.target.value)}
                      style={{
                        width: "100%", boxSizing: "border-box", padding: "3px 5px", fontSize: 11,
                        border: "0.5px solid transparent", borderRadius: 4, background: "transparent",
                        color: row.profEmail ? "#185FA5" : "var(--text-muted)", outline: "none",
                      }}
                      onFocus={e => { e.target.style.border = "0.5px solid var(--border-strong)"; e.target.style.background = "var(--surface-2)"; }}
                      onBlur={e => { e.target.style.border = "0.5px solid transparent"; e.target.style.background = "transparent"; }}
                    />
                    {row.profEmail && (
                      <a href={`mailto:${row.profEmail.split(",").map(s => s.trim()).filter(Boolean).join(",")}`}
                        style={{ fontSize: 10, color: "#185FA5", textDecoration: "none" }}>
                        &#9993; compose
                      </a>
                    )}
                    <select
                      value={(supMap[row.id] || {}).reply || "none_yet"}
                      onChange={e => setSupervisor(row.id, { reply: e.target.value, daysSinceContact: 21 })}
                      title="Recording the supervisor's response sharpens the success estimate"
                      style={{
                        width: "100%", boxSizing: "border-box", marginTop: 3,
                        padding: "2px 4px", fontSize: 9.5, borderRadius: 4,
                        border: "0.5px solid var(--border)", background: "var(--surface-2)",
                        color: "var(--text-secondary)", outline: "none", fontFamily: "inherit",
                      }}>
                      {Object.entries(REPLY_LABEL).map(([v, l]) => (
                        <option key={v} value={v}>{l}</option>
                      ))}
                    </select>
                  </td>

                  <td style={{ ...td, fontSize: 11 }}>{row.remarks}</td>

                  {/* free-text personal note */}
                  <td style={{ ...td, fontSize: 11 }}>
                    <textarea
                      value={row.notes}
                      placeholder="e.g. EU students only"
                      onChange={e => setNote(row.id, e.target.value)}
                      rows={2}
                      style={{
                        width: "100%", boxSizing: "border-box", padding: "3px 5px", fontSize: 11,
                        border: "0.5px solid transparent", borderRadius: 4, background: "transparent",
                        color: "inherit", outline: "none", resize: "vertical", fontFamily: "inherit",
                        lineHeight: 1.35,
                      }}
                      onFocus={e => { e.target.style.border = "0.5px solid var(--border-strong)"; e.target.style.background = "var(--surface-2)"; }}
                      onBlur={e => { e.target.style.border = "0.5px solid transparent"; e.target.style.background = "transparent"; }}
                    />
                  </td>

                  {/* 2 x 3 control block: 4 outcome radios + issue + archive */}
                  <td style={{ ...td, textAlign: "center" }}>
                    <div style={{
                      display: "grid", gridTemplateColumns: "1fr 1fr", gap: 2, width: 138,
                      margin: "0 auto", background: "var(--border)", border: "0.5px solid var(--border-strong)",
                      borderRadius: 6, overflow: "hidden",
                    }}>
                      {["none", "rejected", "applied", "offer"].map(v => {
                        const opt = STATUS_OPTS.find(o => o.val === v);
                        const on = sVal === v;
                        return (
                          <button key={v} role="radio" aria-checked={on} title={opt.label}
                            onClick={() => setStatus(row.id, v)}
                            style={{
                              fontSize: 10, padding: "3px 2px", cursor: "pointer", border: "none",
                              background: on ? opt.bg : "var(--surface-2)",
                              color: on ? opt.fg : "var(--text-muted)",
                              fontWeight: on ? 600 : 400, whiteSpace: "nowrap",
                              display: "flex", alignItems: "center", justifyContent: "center", gap: 3,
                            }}>
                            <span style={{ width: 5, height: 5, borderRadius: "50%", background: on ? opt.dot : "var(--border-strong)", flexShrink: 0 }} />
                            {opt.label}
                          </button>
                        );
                      })}
                      <button title="Flag an application issue (greys out the row)"
                        onClick={() => toggleIssue(row.id)}
                        style={{
                          fontSize: 10, padding: "3px 2px", cursor: "pointer", border: "none",
                          background: row.hasIssue ? "#E7E4DC" : "var(--surface-2)",
                          color: row.hasIssue ? "#57544C" : "var(--text-muted)",
                          fontWeight: row.hasIssue ? 600 : 400,
                        }}>
                        {row.hasIssue ? "Issue ✓" : "Issue"}
                      </button>
                      <button title="Archive this position"
                        onClick={() => toggleArchive(row.id)}
                        style={{
                          fontSize: 10, padding: "3px 2px", cursor: "pointer", border: "none",
                          background: row.isArchived ? "#EDEBE3" : "var(--surface-2)",
                          color: row.isArchived ? "#57544C" : "var(--text-muted)",
                          fontWeight: row.isArchived ? 600 : 400,
                        }}>
                        {row.isArchived ? "Archived" : "Archive"}
                      </button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>

        {visible.length < processed.length && (
          <div ref={sentinelRef} style={{ padding: 16, textAlign: "center", color: "var(--text-muted)", fontSize: 12 }}>
            Loading more positions…
          </div>
        )}
        {processed.length === 0 && (
          <div style={{ padding: 32, textAlign: "center", color: "var(--text-muted)", fontSize: 13 }}>
            Nothing to show here. Try clearing filters or switching view.
          </div>
        )}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: 11, color: "var(--text-muted)", gap: 12, flexWrap: "wrap" }}>
        <span>Showing {visible.length} of {processed.length}. Bold red = under 7 days. Green = offer. Grey = rejected or flagged issue.</span>
        <span>Sorted by {COLS.find(c => c.key === sortCol)?.label} ({sortDir === "asc" ? "asc" : "desc"})</span>
      </div>
    </div>
  );
}

/* =========================================================== source manager */
function SourceManager({ sources, editing, setEditing, onSave, onDelete, onToggle }) {
  const blank = { id: "", name: "", url: "", adapter: ADAPTERS[0], enabled: true, note: "" };
  const [draft, setDraft] = useState(blank);

  useEffect(() => {
    if (editing) setDraft(editing);
  }, [editing]);

  const startNew = () => {
    const d = { ...blank, id: "s" + Date.now().toString(36) };
    setDraft(d);
    setEditing(d);
  };

  const commit = () => {
    if (!draft.name.trim() || !draft.url.trim()) return;
    onSave(draft);
    setDraft(blank);
  };

  const cell = { padding: "6px 8px", fontSize: 12, borderBottom: "0.5px solid var(--border)", verticalAlign: "middle" };
  const inp = {
    width: "100%", boxSizing: "border-box", padding: "4px 6px", fontSize: 12,
    border: "0.5px solid var(--border-strong)", borderRadius: 4,
    background: "var(--surface-2)", color: "var(--text-primary)", outline: "none",
  };

  return (
    <div style={{ border: "1px solid var(--border-strong)", borderRadius: 10, padding: 12, marginBottom: 14, background: "var(--surface-1)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <div>
          <h3 style={{ fontSize: 14, fontWeight: 600, margin: "0 0 2px", color: "var(--text-primary)" }}>Scraping sources</h3>
          <p style={{ fontSize: 11, color: "var(--text-secondary)", margin: 0 }}>
            {sources.filter(s => s.enabled).length} of {sources.length} enabled. Disabled sources are skipped on refresh.
          </p>
        </div>
        <button onClick={startNew}
          style={{ background: "var(--bg-accent)", color: "var(--text-accent)", border: "none", borderRadius: "var(--radius)", padding: "5px 10px", fontSize: 12, cursor: "pointer" }}>
          Add source
        </button>
      </div>

      <div style={{ overflowX: "auto", border: "0.5px solid var(--border)", borderRadius: 8, background: "var(--surface-2)" }}>
        <table style={{ width: "100%", minWidth: 760, borderCollapse: "collapse" }}>
          <thead>
            <tr style={{ background: "var(--surface-1)" }}>
              {["On", "Name", "Base URL", "Adapter", "Note", ""].map(h => (
                <th key={h} style={{ ...cell, textAlign: "left", fontSize: 10.5, textTransform: "uppercase", color: "var(--text-secondary)", fontWeight: 500, borderBottom: "1px solid var(--border-strong)" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sources.map(s => {
              const isEditing = editing?.id === s.id;
              if (isEditing) {
                return (
                  <tr key={s.id}>
                    <td style={cell}>
                      <input type="checkbox" checked={draft.enabled} onChange={e => setDraft({ ...draft, enabled: e.target.checked })} />
                    </td>
                    <td style={cell}><input style={inp} value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} /></td>
                    <td style={cell}><input style={inp} value={draft.url} onChange={e => setDraft({ ...draft, url: e.target.value })} /></td>
                    <td style={cell}>
                      <select style={inp} value={draft.adapter} onChange={e => setDraft({ ...draft, adapter: e.target.value })}>
                        {ADAPTERS.map(a => <option key={a} value={a}>{a}</option>)}
                      </select>
                    </td>
                    <td style={cell}><input style={inp} value={draft.note} onChange={e => setDraft({ ...draft, note: e.target.value })} /></td>
                    <td style={{ ...cell, whiteSpace: "nowrap" }}>
                      <button onClick={commit} style={{ background: "#EAF3DE", color: "#27500A", border: "none", borderRadius: 4, padding: "3px 8px", fontSize: 11, cursor: "pointer", marginRight: 4 }}>Save</button>
                      <button onClick={() => setEditing(null)} style={{ background: "transparent", color: "var(--text-secondary)", border: "none", fontSize: 11, cursor: "pointer" }}>Cancel</button>
                    </td>
                  </tr>
                );
              }
              return (
                <tr key={s.id} style={{ opacity: s.enabled ? 1 : 0.55 }}>
                  <td style={cell}>
                    <input type="checkbox" checked={s.enabled} onChange={() => onToggle(s.id)} style={{ cursor: "pointer" }} />
                  </td>
                  <td style={{ ...cell, fontWeight: 500, color: "var(--text-primary)" }}>{s.name}</td>
                  <td style={{ ...cell, color: "var(--text-secondary)", fontSize: 11 }}>{s.url}</td>
                  <td style={{ ...cell, fontSize: 11 }}>
                    <span style={{ background: "var(--surface-1)", border: "0.5px solid var(--border)", borderRadius: 4, padding: "1px 6px" }}>{s.adapter}</span>
                  </td>
                  <td style={{ ...cell, color: "var(--text-secondary)", fontSize: 11 }}>{s.note || "—"}</td>
                  <td style={{ ...cell, whiteSpace: "nowrap" }}>
                    <button onClick={() => setEditing(s)} style={{ background: "transparent", color: "#185FA5", border: "none", fontSize: 11, cursor: "pointer", marginRight: 6 }}>Edit</button>
                    <button onClick={() => onDelete(s.id)} style={{ background: "transparent", color: "#791F1F", border: "none", fontSize: 11, cursor: "pointer" }}>Remove</button>
                  </td>
                </tr>
              );
            })}
            {editing && !sources.some(s => s.id === editing.id) && (
              <tr>
                <td style={cell}><input type="checkbox" checked={draft.enabled} onChange={e => setDraft({ ...draft, enabled: e.target.checked })} /></td>
                <td style={cell}><input style={inp} autoFocus placeholder="Source name" value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} /></td>
                <td style={cell}><input style={inp} placeholder="https://…" value={draft.url} onChange={e => setDraft({ ...draft, url: e.target.value })} /></td>
                <td style={cell}>
                  <select style={inp} value={draft.adapter} onChange={e => setDraft({ ...draft, adapter: e.target.value })}>
                    {ADAPTERS.map(a => <option key={a} value={a}>{a}</option>)}
                  </select>
                </td>
                <td style={cell}><input style={inp} placeholder="optional" value={draft.note} onChange={e => setDraft({ ...draft, note: e.target.value })} /></td>
                <td style={{ ...cell, whiteSpace: "nowrap" }}>
                  <button onClick={commit} style={{ background: "#EAF3DE", color: "#27500A", border: "none", borderRadius: 4, padding: "3px 8px", fontSize: 11, cursor: "pointer", marginRight: 4 }}>Add</button>
                  <button onClick={() => setEditing(null)} style={{ background: "transparent", color: "var(--text-secondary)", border: "none", fontSize: 11, cursor: "pointer" }}>Cancel</button>
                </td>
              </tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================================================== feedback */
function FeedbackPanel({ onClose }) {
  const [name, setName] = useState("");
  const [role, setRole] = useState("PhD applicant");
  const [rating, setRating] = useState(0);
  const [message, setMessage] = useState("");
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);
  const [error, setError] = useState("");

  const load = async () => {
    setLoading(true);
    try {
      const list = await window.storage?.list("fb:", true);
      const keys = list?.keys || [];
      const rows = [];
      for (const k of keys.slice(-60)) {
        try {
          const r = await window.storage?.get(k, true);
          if (r?.value) rows.push(JSON.parse(r.value));
        } catch (e) { /* skip unreadable entry */ }
      }
      rows.sort((a, b) => (b.at || 0) - (a.at || 0));
      setEntries(rows);
    } catch (e) {
      setEntries([]);
    }
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const submit = async () => {
    if (!message.trim()) { setError("Please write a message first."); return; }
    setSending(true);
    setError("");
    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      name: name.trim() || "Anonymous",
      role,
      rating,
      message: message.trim().slice(0, 2000),
      at: Date.now(),
    };
    try {
      await window.storage?.set(`fb:${entry.id}`, JSON.stringify(entry), true);
      setSent(true);
      setMessage("");
      setRating(0);
      await load();
    } catch (e) {
      setError("Could not send just now. Please try again.");
    }
    setSending(false);
  };

  const inp = {
    width: "100%", boxSizing: "border-box", padding: "5px 7px", fontSize: 12,
    border: "0.5px solid var(--border-strong)", borderRadius: 4,
    background: "var(--surface-2)", color: "var(--text-primary)",
    outline: "none", fontFamily: "inherit",
  };

  return (
    <div style={{ border: "1px solid var(--border-strong)", borderRadius: 10, padding: 12, marginBottom: 14, background: "var(--surface-1)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10, gap: 12 }}>
        <div>
          <h3 style={{ fontSize: 14, fontWeight: 600, margin: "0 0 2px", color: "var(--text-primary)" }}>Feedback</h3>
          <p style={{ fontSize: 11, color: "var(--text-secondary)", margin: 0 }}>
            What would make this genuinely useful for your applications? Posts here are public to
            everyone using this preview, so please leave out anything private.
          </p>
        </div>
        <button onClick={onClose}
          style={{ background: "transparent", border: "none", color: "var(--text-muted)", cursor: "pointer", fontSize: 16, lineHeight: 1, padding: 0 }}>
          &times;
        </button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr auto", gap: 8, marginBottom: 8 }}>
        <input style={inp} placeholder="Name (optional)" value={name} onChange={e => setName(e.target.value)} />
        <select style={inp} value={role} onChange={e => setRole(e.target.value)}>
          {["PhD applicant", "Masters applicant", "Current student", "Supervisor", "Consultant", "Just browsing"].map(r => (
            <option key={r} value={r}>{r}</option>
          ))}
        </select>
        <div style={{ display: "flex", alignItems: "center", gap: 2 }}>
          {[1, 2, 3, 4, 5].map(n => (
            <button key={n} onClick={() => setRating(n)} title={`${n} out of 5`}
              style={{
                background: "transparent", border: "none", cursor: "pointer", padding: "0 1px",
                fontSize: 16, lineHeight: 1, color: n <= rating ? "#639922" : "var(--border-strong)",
              }}>
              &#9733;
            </button>
          ))}
        </div>
      </div>

      <textarea
        style={{ ...inp, minHeight: 62, resize: "vertical", marginBottom: 8 }}
        placeholder="What worked, what was confusing, what is missing? Which sources should be added?"
        value={message}
        onChange={e => { setMessage(e.target.value); setSent(false); }}
      />

      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
        <button onClick={submit} disabled={sending}
          style={{
            background: "#EAF3DE", color: "#27500A", border: "none", borderRadius: "var(--radius)",
            padding: "6px 14px", fontSize: 12, fontWeight: 500,
            cursor: sending ? "default" : "pointer", opacity: sending ? 0.6 : 1,
          }}>
          {sending ? "Sending…" : "Send feedback"}
        </button>
        {sent && <span style={{ fontSize: 11, color: "#27500A" }}>Thanks, that is recorded.</span>}
        {error && <span style={{ fontSize: 11, color: "#791F1F" }}>{error}</span>}
      </div>

      <div style={{ borderTop: "0.5px solid var(--border)", paddingTop: 10 }}>
        <p style={{ fontSize: 11, color: "var(--text-secondary)", margin: "0 0 8px", fontWeight: 500 }}>
          {loading ? "Loading responses…" : `${entries.length} response${entries.length === 1 ? "" : "s"}`}
        </p>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 260, overflowY: "auto" }}>
          {entries.map(e => (
            <div key={e.id} style={{ border: "0.5px solid var(--border)", borderRadius: 6, padding: "7px 9px", background: "var(--surface-2)" }}>
              <div style={{ display: "flex", gap: 8, alignItems: "baseline", marginBottom: 3, flexWrap: "wrap" }}>
                <span style={{ fontSize: 12, fontWeight: 600, color: "var(--text-primary)" }}>{e.name}</span>
                <span style={{ fontSize: 10, color: "var(--text-secondary)", background: "var(--surface-1)", border: "0.5px solid var(--border)", borderRadius: 4, padding: "0 5px" }}>{e.role}</span>
                {e.rating > 0 && <span style={{ fontSize: 10, color: "#639922" }}>{"\u2605".repeat(e.rating)}</span>}
                <span style={{ fontSize: 10, color: "var(--text-muted)", marginLeft: "auto" }}>
                  {new Date(e.at).toLocaleDateString("en-GB", { day: "2-digit", month: "short" })}
                </span>
              </div>
              <p style={{ fontSize: 11.5, color: "var(--text-primary)", margin: 0, lineHeight: 1.45, whiteSpace: "pre-wrap" }}>{e.message}</p>
            </div>
          ))}
          {!loading && entries.length === 0 && (
            <p style={{ fontSize: 11, color: "var(--text-muted)", margin: 0 }}>No responses yet. Yours would be the first.</p>
          )}
        </div>
      </div>
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<PhDTracker />);
  </script>
</body>
</html>
