function applySupervisor(assessment, sup, cfg) {

      pct: null,
      low: null,
      high: null,
      confidence: "unknown",
      blocked: false,
      reasons: [],
      applicants: 0,
      fit: 1,
      soft: 1,
      sup: 1,
      areas: [],
      penalties: [],
      topicSimilarity: 0,
      methodAssessed: false,
      tierKnown: false
    };
  }
  const a = assessment;
  if (a.blocked) {
    return {
      pct: 0,
      low: 0,
      high: 0,
      confidence: "high",
      blocked: true,
      reasons: a.blockReasons || [],
      applicants: a.estimatedApplicants || 0,
      fit: 0,
      soft: a.softMultiplier ?? 1,
      sup: 1,
      areas: a.matchedAreas || [],
      penalties: a.softPenalties || [],
